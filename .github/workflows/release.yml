name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: notes
        run: |
          FILE="docs/release-notes/v${{ steps.version.outputs.VERSION }}.md"
          if [ -f "$FILE" ]; then
            echo "Found release notes: $FILE"
            {
              echo "BODY<<EOF"
              cat "$FILE"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No release notes found at $FILE"
            echo "BODY=No release notes available." >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk food-journal-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Food Journal v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.notes.outputs.BODY }}
          files: food-journal-${{ steps.version.outputs.VERSION }}.apk
